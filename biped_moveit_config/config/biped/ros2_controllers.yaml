controller_manager:
  ros__parameters:
    update_rate: 1000
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    biped_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

biped_joint_trajectory_controller:
  ros__parameters: # Everything below MUST be indented under here
    joints:
      - l_abduction
      - l_hip_roll
      - l_knee_roll
      - r_abduction
      - r_hip_roll
      - r_knee_roll
      
    command_interfaces:
      - effort

    state_interfaces:
      - position
      - velocity

    allow_partial_joints_goal: true

    # FIX: Indent 'gains' so it is inside 'ros__parameters'
    gains:
      l_abduction: {p: 850.0, i: 0.0, d: 1.0}
      l_hip_roll:  {p: 850.0, i: 0.0, d: 1.0}
      l_knee_roll: {p: 850.0, i: 0.0, d: 1.0}
      r_abduction: {p: 850.0, i: 0.0, d: 1.0}
      r_hip_roll:  {p: 850.0, i: 0.0, d: 1.0}
      r_knee_roll: {p: 850.0, i: 0.0, d: 1.0}

    # FIX: Indent these as well
    open_loop_control: false
    stopped_velocity_tolerance: 0.01